version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: epap-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: epap
      POSTGRES_USER: epap
      POSTGRES_PASSWORD: epap123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: epap-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:

    build: ./backend

    container_name: epap-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

  frontend:

    build: ./frontend

    container_name: epap-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend

volumes:

  postgres_data:
